name: Scope macOS export validation
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Private source revision to test
        required: true
permissions:
  contents: read
jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          repository: mordf0kas/drelva
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.DRELVA_SRC_KEY }}
          persist-credentials: false
      - name: Fetch JUCE
        run: git clone --depth 1 --branch 8.0.4 https://github.com/juce-framework/JUCE.git JUCE
      - name: Configure universal plugin
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="${{ matrix.os == 'macos-15' && 'arm64;x86_64' || 'x86_64' }}"
      - name: Build plugin and native test app
        run: cmake --build build --config Release --target DrelvaScope_VST3 DrelvaScope_AU drelva_snapshot drelva_core_test --parallel 3
      - name: Core and session regression tests
        timeout-minutes: 4
        run: |
          build/drelva_core_test
          build/drelva_snapshot_artefacts/Release/drelva_snapshot.app/Contents/MacOS/drelva_snapshot --selftest "$PWD/Tests/data/bars.gif"
      - name: Native AVFoundation exports and cancellation
        timeout-minutes: 5
        run: |
          mkdir -p out/mp4
          build/drelva_snapshot_artefacts/Release/drelva_snapshot.app/Contents/MacOS/drelva_snapshot --mp4test "$PWD/out/mp4"
          swift Tests/validate_mp4.swift "$PWD/out/mp4"
      - name: Full Scope renderer to MP4 at 720p and 1080p
        timeout-minutes: 20
        run: |
          APP=build/drelva_snapshot_artefacts/Release/drelva_snapshot.app/Contents/MacOS/drelva_snapshot
          "$APP" "$PWD/out/render720" --export 3 --export-mp4 --export-height 720 --preset 0 --onscreen
          "$APP" "$PWD/out/render1080" --export 3 --export-mp4 --export-height 1080 --preset 0 --onscreen
          swift Tests/validate_mp4.swift "$PWD/out" --rendered
      - name: Package validated VST3 and AU only
        if: matrix.os == 'macos-15'
        run: |
          mkdir -p package-input/VST3 package-input/AU
          cp -R build/DrelvaScope_artefacts/Release/VST3/Scope.vst3 package-input/VST3/
          cp -R build/DrelvaScope_artefacts/Release/AU/Scope.component package-input/AU/
          bash installer/macos/build_mac_installer.sh package-input Scope com.drelva.scope.installer 1.0 out
          mv out/Scope-Installer.pkg out/Scope-v1-MP4-Fix-Test.pkg
          mv out/Scope.dmg out/Scope-v1-MP4-Fix-Test.dmg
          lipo -archs package-input/VST3/Scope.vst3/Contents/MacOS/Scope > out/architectures.txt
          git rev-parse HEAD > out/source-commit.txt
          shasum -a 256 out/*.pkg out/*.dmg > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Scope-export-test-${{ matrix.os }}
          path: out
          if-no-files-found: warn
